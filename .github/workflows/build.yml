# Compila Secuencias en macOS (DMG universal) y Ubuntu (.deb), corre los tests, y en cada
# etiqueta v* publica una Release con los instaladores adjuntos.
name: Compilar

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  mac:
    name: macOS (DMG universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: brew install ninja
      - name: Compilar y armar el DMG
        run: ./mac/empaquetar.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Secuencias-mac
          path: dist/*.dmg

  ubuntu:
    name: Ubuntu (tests y .deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl-dev
      - name: Tests (debug)
        run: |
          cmake --preset debug
          cmake --build --preset debug
          ctest --preset debug
      - name: Release y .deb
        run: |
          cmake --preset release
          cmake --build --preset release
          ./linux/empaquetar-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Secuencias-ubuntu
          path: dist/*.deb

  release:
    name: Publicar Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, ubuntu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
